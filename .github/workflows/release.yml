name: release

# Tag `v*` on main: Linux x86_64 and arm64 binaries (shogun-api, shogun-mcp, shogun) and a
# multi-arch container image on GHCR. macOS arm64 binaries are added once a macOS runner is
# budgeted; until then the Mac path is the ShogunAI app.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  CARGO_INCREMENTAL: "0"

jobs:
  binaries:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y clang pkg-config
      - name: build
        run: |
          # Server build profile: `embed-local` on (E24). It downloads nothing; the model comes from
          # an explicit `shogun models fetch` and the ONNX Runtime library is resolved at run time.
          cargo build --release --locked --target ${{ matrix.target }} -p shogun-core --features daemon-server,embed-local --bin shogun-api --bin shogun-mcp
          cargo build --release --locked --target ${{ matrix.target }} -p shogun-cli --features embed-local --bin shogun
      - name: package
        run: |
          set -euo pipefail
          out=shogunagent-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir -p "$out"
          cp target/${{ matrix.target }}/release/{shogun-api,shogun-mcp,shogun} "$out/"
          cp LICENSE README.md SKILL.md "$out/"
          tar -czf "$out.tar.gz" "$out"
          sha256sum "$out.tar.gz" > "$out.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            shogunagent-*.tar.gz
            shogunagent-*.tar.gz.sha256

  image:
    # Compile on the matching native CPU; Rust release linking under QEMU exceeded two hours.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: normalize the container repository name
        id: image-name
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/shogunagent" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          cache-from: type=gha,scope=shogunagent-image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=shogunagent-image-${{ matrix.arch }}
          # Per-architecture builds publish only immutable digests. The index job owns tags.
          outputs: type=image,name=${{ steps.image-name.outputs.name }},push-by-digest=true,name-canonical=true,push=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: record the platform digest
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          mkdir -p digests
          printf '%s\n' "$IMAGE_DIGEST" > "digests/$IMAGE_ARCH.digest"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        with:
          name: image-digest-${{ matrix.arch }}
          path: digests/${{ matrix.arch }}.digest
          if-no-files-found: error

  image-index:
    needs: [image]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: docker/setup-buildx-action@v3
      - name: normalize the container repository name
        id: image-name
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/shogunagent" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: image-digest-*
          path: digests
          merge-multiple: true
      - name: publish and inspect the multi-platform index
        id: publish-index
        env:
          IMAGE_NAME: ${{ steps.image-name.outputs.name }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          references=()
          for arch in amd64 arm64; do
            digest="$(cat "digests/$arch.digest")"
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            references+=("$IMAGE_NAME@$digest")
          done
          docker buildx imagetools create --tag "$IMAGE_NAME:$RELEASE_TAG" --tag "$IMAGE_NAME:latest" "${references[@]}"
          docker buildx imagetools inspect "$IMAGE_NAME:$RELEASE_TAG"
          docker buildx imagetools inspect "$IMAGE_NAME:latest"

  github-release:
    needs: [binaries]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-unknown-linux-gnu'
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          body_path: docs/releases/${{ github.ref_name }}.md
          generate_release_notes: true
