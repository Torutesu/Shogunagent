name: CI

# Linux only. Every workspace member builds and tests here; there is no macOS-only crate.
# Mirrors the local verification block in CLAUDE.md.

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  web:
    name: apps/web (build, syntax, links, HTTP)
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm run typecheck --prefix apps/web
      - run: npm test --prefix apps/web
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: local MCP bridge protocol and token safeguards
        run: python3 -m unittest discover -s scripts -p test_mcp_local_bridge.py

  rust:
    name: rust (clippy, test, feature matrix)
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: feature matrix (clippy + test for every CI feature combination)
        run: scripts/check-feature-matrix.sh
      - name: server calendar matches SQLite outside UTC
        run: cargo test --locked -p shogun-core --features daemon-server --lib calendar_regression_tests
        env:
          TZ: Asia/Kolkata
      - name: Maya source-to-handoff replay (synthetic model answers, no network)
        run: cargo run --locked -p shogun-core --features daemon-server --example maya_handoff

  guards:
    name: invariant guards
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: guards (self-test, then the tree)
        run: |
          set -euo pipefail
          for g in http-egress secret-exposure media-writes log-hygiene migrations batch-source-filter desktop-gate; do
            python3 scripts/check-$g.py --self-test
            python3 scripts/check-$g.py
          done
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: every env var apps/api and apps/router read is in the production runbook (E41)
        run: |
          set -euo pipefail
          node scripts/check-env-docs.mjs --self-test
          node scripts/check-env-docs.mjs

  relay:
    name: apps/api (typecheck, node tests)
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @shogun-ai/api typecheck
      - run: pnpm --filter @shogun-ai/api test:node

  router:
    name: "apps/router (typecheck, test, catalog, bundle; E48 idempotency and connector tokens included)"
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @shogunagent/router typecheck
      # Includes the router's SQL (outbox, run idempotency) on the node:sqlite double.
      - run: pnpm --filter @shogunagent/router test
      - run: pnpm --filter @shogunagent/router build:catalog
      # wrangler --dry-run bundles locally; nothing is deployed.
      - run: pnpm --filter @shogunagent/router check:bundle

  agent-surfaces:
    name: "agent-readable surfaces (E10: generated files match, registry entry valid, CLI)"
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Invariant 12: the committed agent-readable files equal what the generators produce.
      - name: llms.txt / llms-full.txt are generated from the docs (E10-T4)
        run: node scripts/gen-llms-txt.mjs --check
      - name: /privacy and /terms are generated from docs/legal (E23)
        run: node scripts/gen-legal-pages.mjs --check
      - name: the agent card's skills are generated from SKILL.md (E10-T3)
        run: node scripts/gen-agent-skills.mjs --check
      - name: server.json validates against the MCP Registry schema (E10-T2)
        run: pnpm registry:validate
      - name: npx shogunagent (E10-T10)
        run: |
          pnpm --filter shogunagent typecheck
          pnpm --filter shogunagent test
          pnpm --filter shogunagent build

  sdk:
    name: "SDKs (E17: @shogunagent/sdk typecheck, test, build; shogunagent pytest)"
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: TypeScript SDK (fake fetch, no network)
        run: |
          pnpm --filter @shogunagent/sdk typecheck
          pnpm --filter @shogunagent/sdk test
          pnpm --filter @shogunagent/sdk build
      # E36b: withShogunAgent inside the real Vercel AI SDK, OpenAI Agents SDK, Claude Agent SDK
      # and LangGraph.js, each with its own mock model; global fetch refuses every request.
      - name: TypeScript SDK in the real frameworks (mock models, no network)
        run: pnpm --filter @shogunagent/sdk test:integration
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      # E36b: the Python adapters inside real LangGraph and OpenAI Agents SDK runs. The frameworks
      # are required here (SHOGUNAGENT_REQUIRE_INTEGRATION=1): a missing one fails, never skips.
      - name: Python SDK (httpx.MockTransport, sockets refused; unit and real-framework tests)
        env:
          SHOGUNAGENT_REQUIRE_INTEGRATION: "1"
        run: |
          python -m pip install -e 'packages/sdk-py[test,integration]'
          cd packages/sdk-py && python -m pytest -q

  conformance:
    name: "MCP conformance (E36a: the 2026-07-28 suite against a local sidecar)"
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: the suite against a fake server (catches each deviation it names)
        run: |
          pnpm --filter @shogunagent/conformance typecheck
          pnpm --filter @shogunagent/conformance test
      # Debug build on purpose: the plan-file and licence-key overrides the throwaway sidecar
      # needs exist only in debug builds. Temp store, random keys, loopback only.
      - name: build the sidecar (shogun-api)
        run: cargo build --locked -p shogun-core --features daemon-server --bin shogun-api
      - name: run the suite against the sidecar (writes, MRTR and approvals included)
        run: pnpm --filter @shogunagent/conformance local

  stack-e2e:
    name: "local stack end to end (Rust, PostgreSQL, gateway, router, SDKs)"
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -e packages/sdk-py
      - run: cargo build --locked -p shogun-core --features daemon-server --bin shogun-api
      - run: pnpm test:e2e
        env:
          SHOGUN_E2E_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable

  release-dry-run:
    name: "release dry run (E40: npm publish --dry-run, python -m build + twine check; nothing is published)"
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: every workflow file parses as YAML (and deploy.yml stays manual-only)
        run: |
          python -m pip install pyyaml
          python scripts/check-workflow-yaml.py --self-test
          python scripts/check-workflow-yaml.py
          python scripts/test-release-image.py
          python scripts/test-recover-v010-image.py
      - name: release versions agree (manifests, code constants, CHANGELOG sections)
        run: node scripts/check-release-versions.mjs
      - run: pnpm install --frozen-lockfile
      - name: npm publish --dry-run (@shogunagent/sdk, shogunagent)
        run: |
          (cd packages/sdk-ts && npm publish --dry-run --access public)
          (cd packages/cli && npm publish --dry-run --access public)
      - name: python -m build + twine check (shogunagent)
        run: |
          python -m pip install build twine
          python -m build --outdir dist packages/sdk-py
          python -m twine check --strict dist/*
