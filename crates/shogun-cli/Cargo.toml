[package]
name = "shogun-cli"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "SHOGUN CLI: the `shogun` command — the terminal/script face of the Memory API (§6.11, one of MCP/CLI/REST)."

# The CLI is one of the three symmetric Memory API faces (FR-API-01). Argument parsing and the
# command → tool/level resolution are dependency-light pure logic (unit-testable on Linux); the
# binary is a thin runner over that. One-way deps: cli → mcp (tool table + dispatcher), cli →
# agents (the L1/L2/L3 Level vocabulary).

[lib]
name = "shogun_cli"
path = "src/lib.rs"

[[bin]]
name = "shogun"
path = "src/main.rs"

[dependencies]
shogun-mcp = { path = "../shogun-mcp" }
shogun-agents = { path = "../shogun-agents" }
# `db` for `shogun principal import` (E2-T6): the tenancy module copies and migrates a store
# locally, with no server involved. The storage layer is already in the graph through shogun-mcp.
shogun-core = { path = "../shogun-core", features = ["db"] }
# The model table of `shogun models` (E24). Already in the graph through shogun-core / shogun-mcp.
shogun-memory = { path = "../shogun-memory" }
serde_json = "1"

# On a Mac the command finds the app's `memory.db` under `~/Library/Application Support`
# (`shogun_mcp::plan_source::app_data_dir`), which the Mac app's `desktop` feature compiles
# (E1-T7). macOS targets only: the Linux server build carries none of the desktop set.
[target.'cfg(target_os = "macos")'.dependencies]
shogun-mcp = { path = "../shogun-mcp", features = ["desktop"] }

[features]
default = []
# `shogun models fetch` (E24): pulls in shogun-core's traced egress (`net`) and the ONNX embedder.
# OFF by default so the CLI stays HTTP-client-free; the server image builds it on.
embed-local = ["shogun-core/embed-local"]

[lints]
workspace = true
